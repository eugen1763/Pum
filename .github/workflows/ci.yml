name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          # Keep the suite out of the runner's real agent directory. bunfig.toml
          # preloads the same guard locally; this is the second layer. The
          # runner context exists only inside a step, so a job-level env here
          # makes the whole workflow invalid and no job runs at all.
          PUM_DIR: ${{ runner.temp }}/pum-agent-dir
      - run: bunx tsc --noEmit
      - run: bun run pack:check
      - run: git diff --check
