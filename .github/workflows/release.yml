name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install current npm CLI
        run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          # Keep the suite out of the runner's real agent directory. bunfig.toml
          # preloads the same guard locally; this is the second layer.
          PUM_DIR: ${{ runner.temp }}/pum-agent-dir
      - run: bunx tsc --noEmit
      - run: git diff --check
      - run: bun run pack:check
      - name: Verify that the tag matches package.json
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          }
      # Trusted publishing: npm exchanges this job's OIDC identity for a
      # short-lived credential, so no token is stored anywhere. The identity
      # npm checks is the repository, this workflow file, and the `npm`
      # environment above, all of which have to match the trusted publisher
      # registered on the package. Provenance is automatic under OIDC; the flag
      # stays as an explicit assertion that a build without it must fail.
      - name: Publish to npm
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [[ "$version" == *-* ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance --tag latest
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          args=("$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
