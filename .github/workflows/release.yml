name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install current npm CLI
        run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: git diff --check
      - run: bun run pack:check
      - name: Verify that the tag matches package.json
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          }
      - name: Publish to npm
        env:
          # Package-scoped granular token with read/write access and Bypass 2FA.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test -n "$NODE_AUTH_TOKEN" || {
            echo "The npm environment is missing NPM_TOKEN." >&2
            exit 1
          }
          if [[ "$version" == *-* ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance --tag latest
          fi
      - name: Promote prerelease to npm latest
        if: ${{ contains(github.ref_name, '-') }}
        env:
          # Reuse the same package-scoped release token for the exact dist-tag update.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test -n "$NODE_AUTH_TOKEN" || {
            echo "The npm environment is missing NPM_TOKEN." >&2
            exit 1
          }
          npm dist-tag add "pum-agent@$version" latest
          test "$(npm view pum-agent dist-tags.beta)" = "$version"
          test "$(npm view pum-agent dist-tags.latest)" = "$version"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          args=("$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
