name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: git diff --check
      - run: bun run pack:check
      - name: Verify that the tag matches package.json
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          }
      # Configure this workflow as the npm trusted publisher after the token-based
      # first-publish bootstrap. See RELEASING.md. No version mutation occurs.
      - name: Publish to npm
        env:
          # This secret is empty during trusted publishing. Add it only for the
          # first publish, then delete it after trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [[ "$version" == *-* ]]; then
            npm publish --tag beta
          else
            npm publish --tag latest
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          args=("$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
